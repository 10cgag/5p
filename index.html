<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>بث وتحكم</title>
    <style>
        body { margin: 0; background: #000; height: 100vh; overflow: hidden; }
        #screenDisplay { width: 100vw; height: 100vh; object-fit: contain; }
        #hiddenInput { position: fixed; top: 0; left: 0; width: 1px; height: 1px; opacity: 0; }
    </style>
</head>
<body>
    <input type="text" id="hiddenInput">
    <img id="screenDisplay" />
    
    <script>
        const ws = new WebSocket(`wss://${window.location.host}`);
        const img = document.getElementById('screenDisplay');
        const hiddenInput = document.getElementById('hiddenInput');

        // اجعل المتصفح يركز دائماً على الحقل الخفي بمجرد اللمس
        document.body.addEventListener('click', () => {
            hiddenInput.focus();
        });

        // إرسال النص
        hiddenInput.addEventListener('input', (e) => {
            const val = e.target.value;
            if (val.length > 0) {
                ws.send(JSON.stringify({ type: 'text', value: val }));
                hiddenInput.value = ""; // تفريغ الحقل فور الإرسال
            }
        });

        // إرسال اللمس
        img.addEventListener('click', (e) => {
            const rect = img.getBoundingClientRect();
            ws.send(JSON.stringify({ 
                type: 'touch', 
                x: (e.clientX - rect.left) / rect.width, 
                y: (e.clientY - rect.top) / rect.height 
            }));
        });

        ws.onmessage = (event) => {
            const url = URL.createObjectURL(event.data);
            img.src = url;
            img.onload = () => URL.revokeObjectURL(url);
        };
    </script>
</body>
</html>
