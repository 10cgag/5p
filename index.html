<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>بث مباشر</title>
    <style>
        body { margin: 0; background: #000; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        #screenDisplay { flex-grow: 1; width: 100vw; object-fit: contain; cursor: crosshair; background: #000; }
        .controls { height: 10vh; display: flex; justify-content: space-around; align-items: center; background: #222; }
        button { padding: 10px; background: #444; color: white; border: none; border-radius: 5px; }
    </style>
</head>
<body>
    <img id="screenDisplay" />
    <div class="controls">
        <button onclick="window.location.reload()">تحديث الاتصال</button>
    </div>
    <script>
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const ws = new WebSocket(protocol + '//' + window.location.host);
        const img = document.getElementById('screenDisplay');
        
        ws.onopen = () => console.log("متصل بالسيرفر");
        ws.onmessage = (e) => {
            const blob = new Blob([e.data], { type: 'image/jpeg' });
            if (img.src) URL.revokeObjectURL(img.src);
            img.src = URL.createObjectURL(blob);
        };
        ws.onerror = (err) => console.error("خطأ في الاتصال:", err);
    </script>
</body>
</html>
