<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بث وتحكم</title>
    <style>
        body { margin: 0; background: #000; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        #screenDisplay { width: 100vw; height: 90vh; cursor: crosshair; }
        .controls { height: 10vh; display: flex; justify-content: space-around; align-items: center; background: #333; }
        button { padding: 10px; color: white; background: #555; border: none; border-radius: 5px; }
    </style>
</head>
<body>
    <img id="screenDisplay" />
    <div class="controls">
        <button onclick="setFit('fill')">ملء الشاشة</button>
        <button onclick="setFit('contain')">إظهار الكل</button>
    </div>
    <script>
        const ws = new WebSocket(`${window.location.protocol === 'https:' ? 'wss:' : 'ws:'}//${window.location.host}`);
        const img = document.getElementById('screenDisplay');
        
        function setFit(mode) { img.style.objectFit = mode; }

        ws.onmessage = async (event) => {
            if (typeof event.data === 'string') return;
            img.src = URL.createObjectURL(new Blob([event.data], { type: 'image/jpeg' }));
        };

        img.addEventListener('click', (e) => {
            const rect = img.getBoundingClientRect();
            ws.send(JSON.stringify({ type: 'touch', x: (e.clientX - rect.left) / rect.width, y: (e.clientY - rect.top) / rect.height }));
        });
    </script>
</body>
</html>
