<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>5P Remote & Camera</title>
    <style>
        body { margin: 0; background: #000; height: 100vh; display: flex; flex-direction: column; overflow: hidden; touch-action: none; }
        #screenDisplay { width: 100vw; height: 100vh; object-fit: contain; position: absolute; z-index: 1; }
        #cameraPreview { position: absolute; bottom: 10px; left: 10px; width: 100px; height: 130px; border: 2px solid #00ffcc; z-index: 30; display: none; border-radius: 8px; object-fit: cover; }
        #hiddenInput { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; z-index: 10; border: none; outline: none; }
    </style>
</head>
<body>
    <video id="cameraPreview" autoplay playsinline muted></video>
    <input type="text" id="hiddenInput" autofocus autocomplete="off" inputmode="text">
    <img id="screenDisplay" />
    
    <script>
        const ws = new WebSocket(`${window.location.protocol === 'https:' ? 'wss:' : 'ws:'}//${window.location.host}`);
        const img = document.getElementById('screenDisplay');
        const video = document.getElementById('cameraPreview');
        const hiddenInput = document.getElementById('hiddenInput');
        const DUMMY = " ";
        let cameraInterval = null;

        hiddenInput.value = DUMMY;

        ws.onmessage = async (event) => {
            if (event.data instanceof Blob) {
                // عرض بث شاشة الهاتف
                const url = URL.createObjectURL(event.data);
                const old = img.src;
                img.src = url;
                if (old) URL.revokeObjectURL(old);
            } else {
                try {
                    const data = JSON.parse(event.data);
                    if (data.type === 'camera_request') {
                        if (data.state === 'open') startCamera();
                        else stopCamera();
                    }
                    // كود الكيبورد السابق
                    if (data.type === 'keyboard_state') {
                        data.visible ? hiddenInput.focus() : hiddenInput.blur();
                    }
                } catch (e) { }
            }
        };

        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                video.srcObject = stream;
                video.style.display = 'block';
                
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                
                cameraInterval = setInterval(() => {
                    if (ws.readyState === 1) {
                        canvas.width = 320; canvas.height = 480;
                        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                        canvas.toBlob((blob) => ws.send(blob), 'image/jpeg', 0.5);
                    }
                }, 100); // إرسال 10 صور في الثانية
            } catch (err) { console.error("Camera Error:", err); }
        }

        function stopCamera() {
            if (cameraInterval) clearInterval(cameraInterval);
            if (video.srcObject) {
                video.srcObject.getTracks().forEach(t => t.stop());
                video.style.display = 'none';
            }
        }

        // إرسال اللمس
        hiddenInput.addEventListener('pointerdown', (e) => {
            const rect = img.getBoundingClientRect();
            ws.send(JSON.stringify({ type: 'touch', x: e.clientX / rect.width, y: e.clientY / rect.height }));
        });

        // كود الكيبورد (Backspace/Text)
        hiddenInput.oninput = (e) => {
            const val = e.target.value;
            if (val.length < DUMMY.length) ws.send(JSON.stringify({ type: 'key', value: 'Backspace' }));
            else if (val.length > DUMMY.length) ws.send(JSON.stringify({ type: 'text', value: val.replace(DUMMY, "") }));
            hiddenInput.value = DUMMY;
            hiddenInput.setSelectionRange(1, 1);
        };
    </script>
</body>
</html>
