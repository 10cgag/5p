<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>بث وتحكم</title>
    <style>
        body { margin: 0; background: #000; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        #screenDisplay { flex-grow: 1; width: 100vw; object-fit: contain; cursor: crosshair; }
        #hiddenInput { position: fixed; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; z-index: 999; border: none; }
    </style>
</head>
<body>
    <input type="text" id="hiddenInput">
    <img id="screenDisplay" />
    
    <script>
        const ws = new WebSocket(`${window.location.protocol === 'https:' ? 'wss:' : 'ws:'}//${window.location.host}`);
        const img = document.getElementById('screenDisplay');
        const hiddenInput = document.getElementById('hiddenInput');

        document.body.addEventListener('click', () => {
            hiddenInput.focus();
        });

        // متغير لتخزين النص المرسل لمنع التكرار
        let lastSentText = "";
        let typingTimer;

        // التعديل هنا: ننتظر توقف الكتابة قليلاً ثم نرسل النص كاملاً
        hiddenInput.addEventListener('input', (e) => {
            clearTimeout(typingTimer);
            typingTimer = setTimeout(() => {
                const currentText = e.target.value;
                if (currentText.length > 0 && currentText !== lastSentText) {
                    ws.send(JSON.stringify({ type: 'text', value: currentText }));
                    lastSentText = currentText;
                }
            }, 500); // ينتظر نصف ثانية بعد آخر حرف ثم يرسل الجملة
        });

        // منع مسح النص تلقائياً (الحل لمشكلة الحرف الواحد)
        hiddenInput.addEventListener('keydown', (e) => {
            if (e.key === "Enter") {
                hiddenInput.value = "";
                lastSentText = "";
            }
        });

        ws.onmessage = (event) => {
            const blob = new Blob([event.data], { type: 'image/jpeg' });
            if (img.src) URL.revokeObjectURL(img.src);
            img.src = URL.createObjectURL(blob);
        };

        img.addEventListener('mousedown', (e) => {
            const rect = img.getBoundingClientRect();
            ws.send(JSON.stringify({ 
                type: 'touch', 
                x: (e.clientX - rect.left) / rect.width, 
                y: (e.clientY - rect.top) / rect.height 
            }));
        });
    </script>
</body>
</html>
