<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; background: #fff; overflow: hidden; }
        #screenDisplay { width: 100vw; height: 100vh; object-fit: contain; }
    </style>
</head>
<body>
    <img id="screenDisplay" />
    <script>
        const ws = new WebSocket(`${window.location.protocol === 'https:' ? 'wss:' : 'ws:'}//${window.location.host}`);
        const img = document.getElementById('screenDisplay');
        ws.onmessage = async (e) => {
            if (typeof e.data !== 'string') {
                img.src = URL.createObjectURL(new Blob([e.data], { type: 'image/jpeg' }));
            }
        };
        img.addEventListener('click', (e) => {
            const r = img.getBoundingClientRect();
            ws.send(JSON.stringify({ type: 'touch', x: (e.clientX - r.left) / r.width, y: (e.clientY - r.top) / r.height }));
        });
    </script>
</body>
</html>
