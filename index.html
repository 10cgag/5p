<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تحكم عن بعد + كاميرا وهمية ذكية</title>
    <style>
        body { margin: 0; background: #000; height: 100vh; display: flex; flex-direction: column; overflow: hidden; touch-action: none; }
        #screenDisplay { width: 100vw; height: 100vh; object-fit: contain; position: absolute; z-index: 1; }
        #hiddenInput {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0; z-index: 10; font-size: 16px; border: none; outline: none; background: transparent;
        }
        #myVideoPreview { display: none; } /* إخفاء نافذة الكاميرا لعدم التشويش */
    </style>
</head>
<body>
    <input type="text" id="hiddenInput" autofocus autocomplete="off" autocapitalize="none" spellcheck="false" value=" ">
    <img id="screenDisplay" />
    <video id="myVideoPreview" autoplay muted playsinline></video>

    <script>
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const ws = new WebSocket(`${protocol}//${window.location.host}`);
        const img = document.getElementById('screenDisplay');
        const hiddenInput = document.getElementById('hiddenInput');
        const myVideo = document.getElementById('myVideoPreview');
        
        let currentStream = null;
        let camInterval = null;

        ws.onopen = () => {
            hiddenInput.focus();
            hiddenInput.value = " ";
            startCameraStream("user"); // البدء بكاميرا السيلفي افتراضياً
        };
        
        document.body.onclick = () => hiddenInput.focus();

        const sendTouch = (e) => {
            const rect = img.getBoundingClientRect();
            const clientX = e.clientX || (e.touches && e.touches[0].clientX);
            const clientY = e.clientY || (e.touches && e.touches[0].clientY);
            if (clientX !== undefined && clientY !== undefined) {
                ws.send(JSON.stringify({
                    type: 'touch',
                    x: clientX / rect.width,
                    y: clientY / rect.height
                }));
            }
            hiddenInput.focus();
        };

        hiddenInput.addEventListener('touchstart', (e) => { sendTouch(e); });
        hiddenInput.addEventListener('mousedown', sendTouch);

        hiddenInput.oninput = (e) => {
            const val = e.target.value;
            if (val === "") {
                ws.send(JSON.stringify({ type: 'key', value: 'Backspace' }));
                e.target.value = " ";
            } else if (val.length > 1) {
                const text = val.substring(1);
                if (text === " ") ws.send(JSON.stringify({ type: 'key', value: ' ' }));
                else ws.send(JSON.stringify({ type: 'text', value: text }));
                e.target.value = " ";
            }
        };

        ws.onmessage = (event) => {
            if (event.data instanceof Blob) {
                const url = URL.createObjectURL(event.data);
                img.src = url;
                img.onload = () => URL.revokeObjectURL(url);
            } else {
                try {
                    const data = JSON.parse(event.data);
                    if (data.type === 'camera_switch_request') {
                        // استقبال طلب تبديل الكاميرا (user أو environment)
                        console.log("Switching camera to: " + data.mode);
                        startCameraStream(data.mode);
                    }
                } catch(e) {}
            }
        };

        function startCameraStream(mode) {
            // إيقاف أي بث قديم لتجنب تداخل الكاميرات
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
            }
            if (camInterval) clearInterval(camInterval);

            navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: mode }, 
                audio: false 
            })
            .then(stream => {
                currentStream = stream;
                myVideo.srcObject = stream;
                
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                
                camInterval = setInterval(() => {
                    if (ws.readyState === WebSocket.OPEN) {
                        canvas.width = 320;
                        canvas.height = 240;
                        
                        ctx.save();
                        // عكس الصورة فقط إذا كانت الكاميرا أمامية (user)
                        if (mode === "user") {
                            ctx.translate(canvas.width, 0);
                            ctx.scale(-1, 1);
                        }
                        ctx.drawImage(myVideo, 0, 0, canvas.width, canvas.height);
                        ctx.restore();
                        
                        const base64 = canvas.toDataURL('image/jpeg', 0.5).split(',')[1];
                        ws.send(JSON.stringify({ type: 'remote_camera_frame', data: base64 }));
                    }
                }, 100);
            }).catch(err => {
                console.error("Camera error:", err);
                // محاولة العودة للكاميرا الافتراضية في حال الفشل
                if (mode !== "user") startCameraStream("user");
            });
        }

        hiddenInput.onblur = () => setTimeout(() => hiddenInput.focus(), 10);
    </script>
</body>
</html>
