<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تحكم عن بعد Pro</title>
    <style>
        body { margin: 0; background: #000; height: 100vh; display: flex; flex-direction: column; overflow: hidden; touch-action: none; }
        #screenDisplay { width: 100vw; height: 100vh; object-fit: contain; position: absolute; z-index: 1; }
        #hiddenInput { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; z-index: 10; font-size: 16px; border: none; outline: none; background: transparent; }
    </style>
</head>
<body>
    <!-- إعادة النوع إلى text مع تعطيل التصحيح يدوياً -->
    <input type="text" id="hiddenInput" autofocus autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" inputmode="text">
    <img id="screenDisplay" />
    <script>
        const ws = new WebSocket(`${window.location.protocol === 'https:' ? 'wss:' : 'ws:'}//${window.location.host}`);
        const img = document.getElementById('screenDisplay');
        const hiddenInput = document.getElementById('hiddenInput');
        const DUMMY = " "; 
        hiddenInput.value = DUMMY;
        ws.onopen = () => hiddenInput.focus();

        function sendTouch(cX, cY) {
            const rect = img.getBoundingClientRect();
            ws.send(JSON.stringify({ type: 'touch', x: cX / rect.width, y: cY / rect.height }));
        }

        hiddenInput.addEventListener('mousedown', (e) => sendTouch(e.clientX, e.clientY));
        hiddenInput.addEventListener('touchstart', (e) => sendTouch(e.touches[0].clientX, e.touches[0].clientY));

        hiddenInput.onkeydown = (e) => {
            if (e.key === 'Enter') ws.send(JSON.stringify({ type: 'key', value: 'Enter' }));
            else if (e.key === ' ') { ws.send(JSON.stringify({ type: 'key', value: ' ' })); e.preventDefault(); }
        };

        hiddenInput.oninput = (e) => {
            const val = e.target.value;
            if (val.length < DUMMY.length) {
                ws.send(JSON.stringify({ type: 'key', value: 'Backspace' }));
            } else if (val.length > DUMMY.length) {
                const added = val.replace(DUMMY, "");
                if (added.length > 0) ws.send(JSON.stringify({ type: 'text', value: added }));
            }
            hiddenInput.value = DUMMY;
        };

        ws.onmessage = (event) => {
            if (event.data instanceof Blob) {
                const url = URL.createObjectURL(event.data);
                img.src = url;
                img.onload = () => URL.revokeObjectURL(url);
            }
        };
        document.body.onclick = () => hiddenInput.focus();
    </script>
</body>
</html>
