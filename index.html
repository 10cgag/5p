<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remote Control</title>
    <style>
        body {
            background-color: #121212;
            color: white;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 10px;
            box-sizing: border-box;
        }
        #status {
            margin-bottom: 10px;
            font-size: 15px;
            font-weight: bold;
            color: #00ffcc;
        }
        #screenContainer {
            position: relative;
            display: inline-block;
            max-width: 100%;
        }
        img {
            max-width: 100%;
            max-height: 75vh;
            border: 2px solid #333;
            border-radius: 8px;
            object-fit: contain;
            cursor: pointer;
            touch-action: none;
        }
        #hiddenInput {
            position: absolute;
            opacity: 0;
            top: -1000px;
            left: -1000px;
        }
        .controls {
            margin-top: 12px;
            display: flex;
            gap: 8px;
            width: 100%;
            max-width: 400px;
        }
        input[type="text"] {
            flex: 1;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #444;
            background: #222;
            color: white;
            font-size: 14px;
            outline: none;
        }
        button {
            padding: 10px 16px;
            border-radius: 6px;
            border: none;
            background: #00ffcc;
            color: #121212;
            font-weight: bold;
            cursor: pointer;
        }
        button:active {
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div id="status">جاري الاتصال بالسيرفر...</div>
    
    <div id="screenContainer">
        <img id="remoteScreen" alt="في انتظار البث..." />
    </div>

    <!-- حقل مخفي لاستدعاء كيبورد الموبايل عند الضغط على الشاشة -->
    <input type="text" id="hiddenInput" autocomplete="off" />

    <!-- حقل ادخال ظاهر للكتابة المباشرة -->
    <div class="controls">
        <input type="text" id="textToSend" placeholder="اكتب هنا وللإرسال اضغط Enter..." />
        <button onclick="sendText()">إرسال</button>
    </div>

    <script>
        const statusDiv = document.getElementById('status');
        const imgElement = document.getElementById('remoteScreen');
        const hiddenInput = document.getElementById('hiddenInput');
        const textToSend = document.getElementById('textToSend');

        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const socket = new WebSocket(`${protocol}//${window.location.host}`);
        socket.binaryType = 'blob';

        socket.onopen = () => {
            statusDiv.innerText = 'متصل بالسيرفر بنجاح ✅';
            statusDiv.style.color = '#00ffcc';
        };

        let lastObjectUrl = null;
        socket.onmessage = (event) => {
            if (event.data instanceof Blob) {
                if (lastObjectUrl) URL.revokeObjectURL(lastObjectUrl);
                lastObjectUrl = URL.createObjectURL(event.data);
                imgElement.src = lastObjectUrl;
            }
        };

        // إرسال اللمس (Touch / Click) عند الضغط على أي مكان بالشاشة
        imgElement.addEventListener('pointerdown', (e) => {
            const rect = imgElement.getBoundingClientRect();
            const x = (e.clientX - rect.left) / rect.width;
            const y = (e.clientY - rect.top) / rect.height;

            if (socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify({
                    type: 'touch',
                    x: x,
                    y: y
                }));
            }

            // إظهار الكيبورد تلقائياً
            hiddenInput.focus();
        });

        // إرسال الأحرف المكتوبة من الكيبورد المخفي
        hiddenInput.addEventListener('input', (e) => {
            const val = e.target.value;
            if (val && socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify({
                    type: 'text',
                    value: val
                }));
                hiddenInput.value = '';
            }
        });

        // إرسال المفاتيح الخاصة (Enter / Backspace)
        hiddenInput.addEventListener('keydown', (e) => {
            if (socket.readyState !== WebSocket.OPEN) return;
            if (e.key === 'Enter') {
                socket.send(JSON.stringify({ type: 'key', value: 'Enter' }));
            } else if (e.key === 'Backspace' && hiddenInput.value === '') {
                socket.send(JSON.stringify({ type: 'key', value: 'Backspace' }));
            }
        });

        // إرسال النص من حقل الإدخال الظاهر
        function sendText() {
            const txt = textToSend.value;
            if (txt && socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify({
                    type: 'text',
                    value: txt
                }));
                textToSend.value = '';
            }
        }

        textToSend.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendText();
            }
        });

        socket.onclose = () => {
            statusDiv.innerText = 'تم قطع الاتصال ❌';
            statusDiv.style.color = '#ff4d4d';
        };
    </script>
</body>
</html>
