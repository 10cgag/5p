<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تحكم عن بعد Pro</title>
    <style>
        body { margin: 0; background: #000; height: 100vh; display: flex; flex-direction: column; overflow: hidden; touch-action: none; }
        #screenDisplay { width: 100vw; height: 100vh; object-fit: contain; position: absolute; z-index: 1; }
        #hiddenInput { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            opacity: 0; z-index: 10; font-size: 16px; border: none; outline: none; background: transparent;
        }
    </style>
</head>
<body>
    <input type="text" id="hiddenInput" autofocus autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" inputmode="text">
    <img id="screenDisplay" />
    
    <script>
        const ws = new WebSocket(`${window.location.protocol === 'https:' ? 'wss:' : 'ws:'}//${window.location.host}`);
        const img = document.getElementById('screenDisplay');
        const hiddenInput = document.getElementById('hiddenInput');
        const DUMMY = ".........."; 

        hiddenInput.value = DUMMY;
        ws.onopen = () => { hiddenInput.focus(); hiddenInput.value = DUMMY; };

        // استخدام pointerdown لمنع إرسال حدثين (تاتش وماوس) في نفس الوقت
        hiddenInput.addEventListener('pointerdown', (e) => {
            const rect = img.getBoundingClientRect();
            
            // حساب الإحداثيات بدقة عالية مع مراعاة الحواف السوداء (object-fit: contain)
            const imgRatio = img.naturalWidth / img.naturalHeight;
            const containerRatio = rect.width / rect.height;
            let actualWidth, actualHeight, offsetX = 0, offsetY = 0;

            if (containerRatio > imgRatio) {
                actualHeight = rect.height;
                actualWidth = actualHeight * imgRatio;
                offsetX = (rect.width - actualWidth) / 2;
            } else {
                actualWidth = rect.width;
                actualHeight = actualWidth / imgRatio;
                offsetY = (rect.height - actualHeight) / 2;
            }

            const x = (e.clientX - rect.left - offsetX) / actualWidth;
            const y = (e.clientY - rect.top - offsetY) / actualHeight;

            if (x >= 0 && x <= 1 && y >= 0 && y <= 1) {
                ws.send(JSON.stringify({ type: 'touch', x: x, y: y }));
            }
        });

        hiddenInput.onkeydown = (e) => {
            if (e.key === 'Enter') ws.send(JSON.stringify({ type: 'key', value: 'Enter' }));
            else if (e.key === ' ') { 
                ws.send(JSON.stringify({ type: 'key', value: ' ' })); 
                e.preventDefault(); 
            }
        };

        hiddenInput.oninput = (e) => {
            const val = e.target.value;
            if (val.length < DUMMY.length) {
                const count = DUMMY.length - val.length;
                for (let i = 0; i < count; i++) {
                    ws.send(JSON.stringify({ type: 'key', value: 'Backspace' }));
                }
            } else if (val.length > DUMMY.length) {
                const added = val.substring(DUMMY.length);
                ws.send(JSON.stringify({ type: 'text', value: added }));
            }
            hiddenInput.value = DUMMY;
            hiddenInput.setSelectionRange(DUMMY.length, DUMMY.length);
        };

        ws.onmessage = (event) => {
            if (event.data instanceof Blob) {
                const url = URL.createObjectURL(event.data);
                img.src = url;
                img.onload = () => URL.revokeObjectURL(url);
            }
        };
    </script>
</body>
</html>
