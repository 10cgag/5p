<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بث وتحكم</title>
    <style>
        body { margin: 0; background: #000; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        /* منطقة البث تحتل كامل المساحة */
        #screenDisplay { flex-grow: 1; width: 100vw; object-fit: contain; cursor: crosshair; z-index: 1; }
        /* حقل نصي مخفي تماماً في الخلفية ولا يغطي الصورة */
        #keyboardInput { position: absolute; opacity: 0; top: -100px; }
    </style>
</head>
<body>
    <input type="text" id="keyboardInput">
    <img id="screenDisplay" />
    
    <script>
        // الاتصال المباشر (Railway سيقوم بالتوجيه التلقائي للمنفذ)
        const ws = new WebSocket(`${window.location.protocol === 'https:' ? 'wss:' : 'ws:'}//${window.location.host}`);
        const img = document.getElementById('screenDisplay');
        const keyboardInput = document.getElementById('keyboardInput');

        // عند لمس الشاشة في أي مكان -> افتح لوحة المفاتيح
        document.body.addEventListener('click', () => {
            keyboardInput.focus();
        });

        // عند الكتابة -> أرسل النص
        keyboardInput.oninput = (e) => {
            ws.send(JSON.stringify({ type: 'text', value: e.target.value }));
            keyboardInput.value = ""; 
        };

        // عرض الصورة (المسؤول عن حل مشكلة الشاشة السوداء)
        ws.onmessage = (event) => {
            const blob = new Blob([event.data], { type: 'image/jpeg' });
            if (img.src) URL.revokeObjectURL(img.src);
            img.src = URL.createObjectURL(blob);
        };

        // إرسال اللمس
        img.addEventListener('click', (e) => {
            const rect = img.getBoundingClientRect();
            ws.send(JSON.stringify({ 
                type: 'touch', 
                x: (e.clientX - rect.left) / rect.width, 
                y: (e.clientY - rect.top) / rect.height 
            }));
        });
    </script>
</body>
</html>
