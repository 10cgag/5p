<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بث وتحكم</title>
    <style>
        /* تم ضبط الخلفية لتكون بيضاء تماماً */
        body { 
            margin: 0; 
            background: #ffffff !important; 
            height: 100vh; 
            overflow: hidden; 
            display: flex; 
            flex-direction: column; 
        }
        
        #screenDisplay { 
            flex-grow: 1; 
            width: 100vw; 
            object-fit: contain; 
            cursor: crosshair; 
        }
        
        .controls { 
            height: 10vh; 
            display: flex; 
            justify-content: space-around; 
            align-items: center; 
            background: #f0f0f0; /* خلفية الأزرار رمادي فاتح */
        }
        button { 
            padding: 10px; 
            color: #000; 
            background: #ddd; 
            border: 1px solid #999; 
            border-radius: 5px; 
            cursor: pointer; 
        }
    </style>
</head>
<body>
    <img id="screenDisplay" />
    <div class="controls">
        <button onclick="setFit('fill')">ملء الشاشة</button>
        <button onclick="setFit('contain')">إظهار الكل</button>
    </div>
    <script>
        const ws = new WebSocket(`${window.location.protocol === 'https:' ? 'wss:' : 'ws:'}//${window.location.host}`);
        const img = document.getElementById('screenDisplay');
        
        function setFit(mode) { img.style.objectFit = mode; }

        ws.onmessage = (event) => {
            const blob = new Blob([event.data], { type: 'image/jpeg' });
            if (img.src) URL.revokeObjectURL(img.src);
            img.src = URL.createObjectURL(blob);
        };

        img.addEventListener('click', (e) => {
            const rect = img.getBoundingClientRect();
            ws.send(JSON.stringify({ 
                type: 'touch', 
                x: (e.clientX - rect.left) / rect.width, 
                y: (e.clientY - rect.top) / rect.height 
            }));
        });
    </script>
</body>
</html>
