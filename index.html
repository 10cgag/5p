<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>بث وتحكم</title>
    <style>
        body { margin: 0; background: #000; height: 100vh; overflow: hidden; }
        #screenDisplay { width: 100vw; height: 100vh; object-fit: contain; }
        #textInput { position: fixed; bottom: 10px; width: 90%; left: 5%; padding: 10px; }
    </style>
</head>
<body>
    <img id="screenDisplay" />
    <input type="text" id="textInput" placeholder="اكتب هنا ثم اضغط Enter">
    
    <script>
        const ws = new WebSocket(`wss://${window.location.host}`);
        const img = document.getElementById('screenDisplay');
        const textInput = document.getElementById('textInput');

        // استقبال الصورة
        ws.onmessage = (event) => {
            if (event.data instanceof Blob) {
                const url = URL.createObjectURL(event.data);
                img.src = url;
            }
        };

        // إرسال اللمس (يحدث فقط عند النقر على صورة الشاشة)
        img.addEventListener('click', (e) => {
            const rect = img.getBoundingClientRect();
            ws.send(JSON.stringify({ 
                type: 'touch', 
                x: (e.clientX - rect.left) / rect.width, 
                y: (e.clientY - rect.top) / rect.height 
            }));
        });

        // إرسال النص (عند الضغط على Enter)
        textInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                ws.send(JSON.stringify({ type: 'text', value: textInput.value }));
                textInput.value = "";
            }
        });
    </script>
</body>
</html>
