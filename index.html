<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تحكم احترافي عن بعد</title>
    <style>
        body { margin: 0; background: #000; height: 100vh; display: flex; flex-direction: column; overflow: hidden; touch-action: none; }
        #screenDisplay { width: 100vw; height: 100vh; object-fit: contain; }
        
        /* حقل التقاط الكتابة - مخفي */
        #hiddenInput { 
            position: fixed; top: -100px; left: -100px; width: 1px; height: 1px; opacity: 0; 
        }
    </style>
</head>
<body>
    <input type="text" id="hiddenInput" autofocus>
    <img id="screenDisplay" />
    
    <script>
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const ws = new WebSocket(`${protocol}//${window.location.host}`);
        const img = document.getElementById('screenDisplay');
        const hiddenInput = document.getElementById('hiddenInput');

        // الحفاظ على التركيز للكتابة دائماً
        document.body.onclick = () => hiddenInput.focus();
        ws.onopen = () => hiddenInput.focus();

        // 1. التقاط المفاتيح الخاصة (Backspace, Enter, Space)
        hiddenInput.onkeydown = (e) => {
            if (e.key === 'Backspace') {
                ws.send(JSON.stringify({ type: 'key', value: 'Backspace' }));
            } else if (e.key === 'Enter') {
                ws.send(JSON.stringify({ type: 'key', value: 'Enter' }));
            } else if (e.key === ' ') {
                // إرسال المسافة كأمر "مفتاح" لضمان عملها في حقول الإيميل
                ws.send(JSON.stringify({ type: 'key', value: ' ' }));
                e.preventDefault(); // منع تكرار المسافة في الحقل
            }
        };

        // 2. إرسال النصوص العادية
        hiddenInput.oninput = (e) => {
            const val = e.target.value;
            if (val.length > 0 && val !== " ") {
                ws.send(JSON.stringify({ type: 'text', value: val }));
                hiddenInput.value = ""; // تصفير الحقل للاستعداد للحرف التالي
            }
        };

        // 3. إرسال اللمس (يدعم الكمبيوتر والجوال)
        const sendTouch = (e) => {
            const rect = img.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            
            ws.send(JSON.stringify({ 
                type: 'touch', 
                x: (clientX - rect.left) / rect.width, 
                y: (clientY - rect.top) / rect.height 
            }));
            hiddenInput.focus(); // إعادة التركيز للكيبورد بعد اللمس
        };

        img.addEventListener('mousedown', sendTouch);
        img.addEventListener('touchstart', (e) => { e.preventDefault(); sendTouch(e); });

        // 4. عرض صورة الشاشة
        ws.onmessage = (event) => {
            if (event.data instanceof Blob) {
                const url = URL.createObjectURL(event.data);
                img.src = url;
                img.onload = () => URL.revokeObjectURL(url);
            }
        };
    </script>
</body>
</html>
