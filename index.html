<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Screen Stream</title>
    <style>
        body {
            background-color: #121212;
            color: white;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        #status {
            margin-bottom: 15px;
            font-size: 16px;
            font-weight: bold;
            color: #00ffcc;
        }
        img {
            max-width: 100%;
            max-height: 85vh;
            border: 2px solid #333;
            border-radius: 8px;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <div id="status">جاري الاتصال بالسيرفر...</div>
    <img id="remoteScreen" alt="في انتظار البث..." />

    <script>
        const statusDiv = document.getElementById('status');
        const imgElement = document.getElementById('remoteScreen');

        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const socket = new WebSocket(`${protocol}//${window.location.host}`);
        
        // تحديد استقبال البيانات كـ Blob
        socket.binaryType = 'blob';

        socket.onopen = () => {
            statusDiv.innerText = 'متصل بالسيرفر بنجاح ✅';
            statusDiv.style.color = '#00ffcc';
        };

        let lastObjectUrl = null;

        socket.onmessage = (event) => {
            if (event.data instanceof Blob) {
                // إلغاء الرابط القديم لتفادي استهلاك الذاكرة
                if (lastObjectUrl) {
                    URL.revokeObjectURL(lastObjectUrl);
                }
                lastObjectUrl = URL.createObjectURL(event.data);
                imgElement.src = lastObjectUrl;
            } else if (typeof event.data === 'string') {
                imgElement.src = event.data;
            }
        };

        socket.onclose = () => {
            statusDiv.innerText = 'تم قطع الاتصال بالسيرفر ❌';
            statusDiv.style.color = '#ff4d4d';
        };

        socket.onerror = (error) => {
            console.error('WebSocket Error:', error);
            statusDiv.innerText = 'حدث خطأ في الاتصال!';
            statusDiv.style.color = '#ff4d4d';
        };
    </script>
</body>
</html>
