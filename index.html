<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>بث وتحكم</title>
    <style>
        body { margin: 0; background: #000; height: 100vh; display: flex; flex-direction: column; }
        /* شريط التحكم في الأعلى */
        #toolbar { height: 50px; background: #222; display: flex; align-items: center; padding: 0 10px; }
        #keyboardInput { flex-grow: 1; height: 35px; border-radius: 5px; border: 1px solid #555; padding: 5px; }
        /* منطقة البث */
        #screenDisplay { flex-grow: 1; width: 100vw; object-fit: contain; cursor: crosshair; }
    </style>
</head>
<body>
    <div id="toolbar">
        <input type="text" id="keyboardInput" placeholder="اضغط هنا للكتابة...">
    </div>
    
    <img id="screenDisplay" />
    
    <script>
        // الاتصال بالسيرفر
        const ws = new WebSocket(`${window.location.protocol === 'https:' ? 'wss:' : 'ws:'}//${window.location.host}`);
        const img = document.getElementById('screenDisplay');
        const keyboardInput = document.getElementById('keyboardInput');

        // إرسال النص بمجرد الكتابة
        keyboardInput.oninput = (e) => {
            ws.send(JSON.stringify({ type: 'text', value: e.target.value }));
            keyboardInput.value = ""; 
        };

        // استقبال الصورة
        ws.onmessage = (event) => {
            const blob = new Blob([event.data], { type: 'image/jpeg' });
            if (img.src) URL.revokeObjectURL(img.src);
            img.src = URL.createObjectURL(blob);
        };

        // إرسال اللمس
        img.addEventListener('click', (e) => {
            const rect = img.getBoundingClientRect();
            ws.send(JSON.stringify({ 
                type: 'touch', 
                x: (e.clientX - rect.left) / rect.width, 
                y: (e.clientY - rect.top) / rect.height 
            }));
        });
    </script>
</body>
</html>
