<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تحكم عن بعد</title>
    <style>
        body { margin: 0; background: #000; height: 100vh; display: flex; flex-direction: column; overflow: hidden; touch-action: none; }
        #screenDisplay { width: 100vw; height: 100vh; object-fit: contain; position: absolute; z-index: 1; }
        
        /* حقل الكتابة: شفاف ويغطي الشاشة لفتح الكيبورد عند اللمس */
        #hiddenInput { 
            position: absolute; 
            top: 0; left: 0; width: 100%; height: 100%; 
            opacity: 0; z-index: 10; 
            font-size: 16px; /* يمنع الزوم التلقائي في الآيفون */
            border: none; outline: none;
            background: transparent;
        }
    </style>
</head>
<body>
    <input type="text" id="hiddenInput" autofocus autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false">
    <img id="screenDisplay" />
    
    <script>
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const ws = new WebSocket(`${protocol}//${window.location.host}`);
        const img = document.getElementById('screenDisplay');
        const hiddenInput = document.getElementById('hiddenInput');

        // فتح الكيبورد تلقائياً عند الاتصال
        ws.onopen = () => hiddenInput.focus();

        // إرسال اللمس من خلال الحقل الشفاف
        hiddenInput.addEventListener('mousedown', (e) => {
            const rect = img.getBoundingClientRect();
            ws.send(JSON.stringify({ 
                type: 'touch', 
                x: e.clientX / rect.width, 
                y: e.clientY / rect.height 
            }));
        });

        // إرسال اللمس للموبايل
        hiddenInput.addEventListener('touchstart', (e) => {
            const rect = img.getBoundingClientRect();
            const touch = e.touches[0];
            ws.send(JSON.stringify({ 
                type: 'touch', 
                x: touch.clientX / rect.width, 
                y: touch.clientY / rect.height 
            }));
        });

        // التقاط المسح والمسافة والإدخال
        hiddenInput.onkeydown = (e) => {
            if (e.key === 'Backspace') {
                ws.send(JSON.stringify({ type: 'key', value: 'Backspace' }));
            } else if (e.key === 'Enter') {
                ws.send(JSON.stringify({ type: 'key', value: 'Enter' }));
            } else if (e.key === ' ') {
                ws.send(JSON.stringify({ type: 'key', value: ' ' }));
                e.preventDefault();
            }
        };

        // إرسال النصوص
        hiddenInput.oninput = (e) => {
            const val = e.target.value;
            if (val.length > 0 && val !== " ") {
                ws.send(JSON.stringify({ type: 'text', value: val }));
                e.target.value = ""; // تصفير للاستعداد للحرف التالي
            }
        };

        // عرض الشاشة
        ws.onmessage = (event) => {
            if (event.data instanceof Blob) {
                const url = URL.createObjectURL(event.data);
                img.src = url;
                img.onload = () => URL.revokeObjectURL(url);
            }
        };
    </script>
</body>
</html>
