<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بث الشاشة المباشر</title>
    <style>
        body { margin: 0; background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        img { max-width: 100%; max-height: 100%; object-fit: contain; }
    </style>
</head>
<body>
    <img id="screenDisplay" src="" alt="بانتظار بدء البث من الهاتف..." />

    <script>
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const ws = new WebSocket(`${protocol}//${window.location.host}`);
        const img = document.getElementById('screenDisplay');

        ws.onmessage = (event) => {
            if (typeof event.data === 'string') {
                img.src = event.data.startsWith('data:image') ? event.data : 'data:image/jpeg;base64,' + event.data;
            } else {
                const blob = new Blob([event.data], { type: 'image/jpeg' });
                img.src = URL.createObjectURL(blob);
            }
        };
        ws.onclose = () => { console.log('تم قطع الاتصال بالسيرفر'); };
    </script>
</body>
</html>
