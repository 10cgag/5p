<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Remote Control Center</title>
    <style>
        body { margin: 0; background: #000; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        #screenDisplay { flex-grow: 1; width: 100vw; object-fit: contain; cursor: crosshair; }
        #textInput { position: fixed; bottom: 10px; width: 90%; left: 5%; height: 50px; border-radius: 10px; padding: 10px; font-size: 18px; }
    </style>
</head>
<body>
    <img id="screenDisplay" />
    <input type="text" id="textInput" placeholder="اكتب هنا ثم اضغط Enter للإرسال...">
    
    <script>
        const ws = new WebSocket(`${window.location.protocol === 'https:' ? 'wss:' : 'ws:'}//${window.location.host}`);
        const img = document.getElementById('screenDisplay');
        const textInput = document.getElementById('textInput');

        // إرسال النص فقط عند الضغط على Enter
        textInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                ws.send(JSON.stringify({ type: 'text', value: textInput.value }));
                textInput.value = ''; // تنظيف الحقل بعد الإرسال
            } else if (e.key === 'Backspace') {
                ws.send(JSON.stringify({ type: 'delete' }));
            }
        });

        ws.onmessage = (event) => {
            if (event.data instanceof Blob) {
                const blob = new Blob([event.data], { type: 'image/jpeg' });
                if (img.src) URL.revokeObjectURL(img.src);
                img.src = URL.createObjectURL(blob);
            }
        };

        img.addEventListener('mousedown', (e) => {
            const rect = img.getBoundingClientRect();
            ws.send(JSON.stringify({ 
                type: 'touch', 
                x: (e.clientX - rect.left) / rect.width, 
                y: (e.clientY - rect.top) / rect.height 
            }));
        });
    </script>
</body>
</html>
