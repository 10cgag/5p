<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تحكم عن بعد Pro</title>
    <style>
        body { margin: 0; background: #000; height: 100vh; display: flex; flex-direction: column; overflow: hidden; touch-action: none; }
        #screenDisplay { width: 100vw; height: 100vh; object-fit: contain; position: absolute; z-index: 1; }
        
        /* حقل شفاف من نوع password لمنع تكرار الحروف المزعج */
        #hiddenInput { 
            position: absolute; 
            top: 0; left: 0; width: 100%; height: 100%; 
            opacity: 0; z-index: 10; 
            font-size: 16px; border: none; outline: none; background: transparent;
        }
    </style>
</head>
<body>
    <input type="password" id="hiddenInput" autofocus autocomplete="off" inputmode="text">
    <img id="screenDisplay" />
    
    <script>
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const ws = new WebSocket(`${protocol}//${window.location.host}`);
        const img = document.getElementById('screenDisplay');
        const hiddenInput = document.getElementById('hiddenInput');

        // قيمة وهمية بسيطة
        const DUMMY = "•"; 
        hiddenInput.value = DUMMY;

        ws.onopen = () => {
            hiddenInput.focus();
        };

        // إرسال اللمس بدقة
        function sendTouch(clientX, clientY) {
            const rect = img.getBoundingClientRect();
            ws.send(JSON.stringify({ 
                type: 'touch', 
                x: clientX / rect.width, 
                y: clientY / rect.height 
            }));
        }

        hiddenInput.addEventListener('mousedown', (e) => sendTouch(e.clientX, e.clientY));
        hiddenInput.addEventListener('touchstart', (e) => sendTouch(e.touches[0].clientX, e.touches[0].clientY));

        // الأزرار الخاصة
        hiddenInput.onkeydown = (e) => {
            if (e.key === 'Enter') {
                ws.send(JSON.stringify({ type: 'key', value: 'Enter' }));
            } else if (e.key === ' ') {
                ws.send(JSON.stringify({ type: 'key', value: ' ' }));
                e.preventDefault();
            }
        };

        // معالجة النصوص ومنع التكرار
        hiddenInput.oninput = (e) => {
            const val = e.target.value;
            
            if (val.length < DUMMY.length) {
                // ضغطة مسح Backspace
                ws.send(JSON.stringify({ type: 'key', value: 'Backspace' }));
            } else if (val.length > DUMMY.length) {
                // كتابة نص جديد
                const added = val.substring(DUMMY.length);
                ws.send(JSON.stringify({ type: 'text', value: added }));
            }
            
            // إعادة التصفير فوراً
            hiddenInput.value = DUMMY;
        };

        // استقبال بث الشاشة
        ws.onmessage = (event) => {
            if (event.data instanceof Blob) {
                const url = URL.createObjectURL(event.data);
                img.src = url;
                img.onload = () => URL.revokeObjectURL(url);
            }
        };

        // الحفاظ على الفوكس للكيبورد
        document.body.onclick = () => hiddenInput.focus();
    </script>
</body>
</html>
