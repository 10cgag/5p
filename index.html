<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>بث وتحكم</title>
    <style>
        body { margin: 0; background: #000; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        #screenDisplay { flex-grow: 1; width: 100vw; object-fit: contain; cursor: crosshair; }
        
        /* حقل مخفي تماماً ولكن موجود في "مقدمة" الصفحة ليلتقط اللمس */
        #hiddenInput { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            opacity: 0; 
            z-index: 999; 
            border: none;
            background: transparent;
        }
    </style>
</head>
<body>
    <input type="text" id="hiddenInput">
    
    <img id="screenDisplay" />
    
    <script>
        const ws = new WebSocket(`${window.location.protocol === 'https:' ? 'wss:' : 'ws:'}//${window.location.host}`);
        const img = document.getElementById('screenDisplay');
        const hiddenInput = document.getElementById('hiddenInput');

        // بمجرد لمس أي مكان في الشاشة، اجعل التركيز على الحقل المخفي
        document.body.addEventListener('click', () => {
            hiddenInput.focus();
        });

        // إرسال النص
        hiddenInput.oninput = (e) => {
            if (e.target.value.length > 0) {
                ws.send(JSON.stringify({ type: 'text', value: e.target.value }));
                hiddenInput.value = ""; 
            }
        };

        // استقبال الصورة
        ws.onmessage = (event) => {
            const blob = new Blob([event.data], { type: 'image/jpeg' });
            if (img.src) URL.revokeObjectURL(img.src);
            img.src = URL.createObjectURL(blob);
        };

        // إرسال اللمس (ملاحظة: هذا الكود قد يتعارض مع الـ input المخفي)
        // لذا سنقوم بإرسال اللمس من خلال الحقل المخفي نفسه
        hiddenInput.addEventListener('mousedown', (e) => {
            const rect = img.getBoundingClientRect();
            ws.send(JSON.stringify({ 
                type: 'touch', 
                x: (e.clientX - rect.left) / rect.width, 
                y: (e.clientY - rect.top) / rect.height 
            }));
        });
    </script>
</body>
</html>
