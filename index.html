<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بث مباشر</title>
    <style>
        body { margin: 0; padding: 0; background: #fff; height: 100vh; width: 100vw; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        #screenDisplay { width: 100%; height: 100%; object-fit: contain; cursor: crosshair; }
        #status { position: absolute; color: red; font-family: sans-serif; }
    </style>
</head>
<body>
    <div id="status">جاري الاتصال...</div>
    <img id="screenDisplay" />
    <script>
        const ws = new WebSocket(`${window.location.protocol === 'https:' ? 'wss:' : 'ws:'}//${window.location.host}`);
        const img = document.getElementById('screenDisplay');
        const status = document.getElementById('status');
        
        ws.onopen = () => status.innerText = "متصل - بانتظار الصورة";
        ws.onclose = () => status.innerText = "تم قطع الاتصال";
        
        ws.onmessage = async (event) => {
            if (typeof event.data === 'string') return; // تجاهل الرسائل النصية
            
            status.style.display = "none"; // إخفاء كلمة "جاري الاتصال" عند وصول أول صورة
            const blob = new Blob([event.data], { type: 'image/jpeg' });
            
            // تحديث الصورة
            img.src = URL.createObjectURL(blob);
        };

        img.addEventListener('click', (e) => {
            const rect = img.getBoundingClientRect();
            ws.send(JSON.stringify({ 
                type: 'touch', 
                x: (e.clientX - rect.left) / rect.width, 
                y: (e.clientY - rect.top) / rect.height 
            }));
        });
    </script>
</body>
</html>
