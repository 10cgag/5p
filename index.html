<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remote Control</title>
    <style>
        body { margin: 0; background: #000; height: 100vh; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        #screenDisplay { width: 100vw; height: 100vh; object-fit: contain; cursor: crosshair; }
        #hiddenInput { position: absolute; top: -100px; opacity: 0; }
    </style>
</head>
<body>
    <input type="text" id="hiddenInput">
    <img id="screenDisplay" />
    
    <script>
        const ws = new WebSocket(`wss://${window.location.host}`);
        const img = document.getElementById('screenDisplay');
        const hiddenInput = document.getElementById('hiddenInput');

        ws.onmessage = (event) => {
            if (event.data instanceof Blob) {
                const url = URL.createObjectURL(event.data);
                img.src = url;
                img.onload = () => URL.revokeObjectURL(url);
            }
        };

        img.addEventListener('click', (e) => {
            const rect = img.getBoundingClientRect();
            ws.send(JSON.stringify({ 
                type: 'touch', 
                x: (e.clientX - rect.left) / rect.width, 
                y: (e.clientY - rect.top) / rect.height 
            }));
            hiddenInput.focus();
        });

        // التعديل هنا: إضافة مؤقت لإرسال الجملة كاملة
        let typingTimer;
        hiddenInput.addEventListener('input', (e) => {
            clearTimeout(typingTimer);
            // الانتظار 300ms بعد آخر حرف كتبته قبل الإرسال
            typingTimer = setTimeout(() => {
                const text = e.target.value;
                if (text.length > 0) {
                    ws.send(JSON.stringify({ type: 'text', value: text }));
                    e.target.value = ""; // تفريغ بعد إرسال الجملة
                }
            }, 300);
        });
    </script>
</body>
</html>
