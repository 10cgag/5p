<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Screen Stream</title>
    <style>
        body {
            background-color: #121212;
            color: white;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        #status {
            margin-bottom: 10px;
            font-size: 14px;
            color: #00ffcc;
        }
        img {
            max-width: 100%;
            max-height: 80vh;
            border: 2px solid #333;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <div id="status">جاري الاتصال بالسيرفر...</div>
    <img id="remoteScreen" alt="في انتظار البث..." />

    <script>
        const statusDiv = document.getElementById('status');
        const imgElement = document.getElementById('remoteScreen');

        // التحديد التلقائي لبروتوكول الـ WebSocket (wss لـ Render و ws للـ Local)
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const socket = new WebSocket(`${protocol}//${window.location.host}`);

        socket.onopen = () => {
            statusDiv.innerText = 'متصل بالسيرفر بنجاح ✅';
            statusDiv.style.color = '#00ffcc';
        };

        socket.onmessage = (event) => {
            // استقبال الإطارات وعرضها
            imgElement.src = event.data;
        };

        socket.onclose = () => {
            statusDiv.innerText = 'تم قطع الاتصال بالسيرفر ❌';
            statusDiv.style.color = '#ff4d4d';
        };

        socket.onerror = (error) => {
            console.error('WebSocket Error:', error);
            statusDiv.innerText = 'حدث خطأ في الاتصال!';
            statusDiv.style.color = '#ff4d4d';
        };
    </script>
</body>
</html>
