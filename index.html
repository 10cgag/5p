<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remote Control</title>
    <style>
        body { margin: 0; background: #000; height: 100vh; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        #screenDisplay { width: 100vw; height: 100vh; object-fit: contain; cursor: crosshair; }
        #hiddenInput { position: absolute; top: -100px; }
    </style>
</head>
<body>
    <input type="text" id="hiddenInput">
    <img id="screenDisplay" />
    
    <script>
        const ws = new WebSocket(`wss://${window.location.host}`);
        const img = document.getElementById('screenDisplay');
        const hiddenInput = document.getElementById('hiddenInput');

        // 1. استقبال الصورة (بدون تعارض)
        ws.onmessage = (event) => {
            if (event.data instanceof Blob) {
                const url = URL.createObjectURL(event.data);
                img.src = url;
                img.onload = () => URL.revokeObjectURL(url);
            }
        };

        // 2. عند لمس الصورة، أرسل اللمس واجعل التركيز على الحقل للكتابة
        img.addEventListener('click', (e) => {
            const rect = img.getBoundingClientRect();
            ws.send(JSON.stringify({ 
                type: 'touch', 
                x: (e.clientX - rect.left) / rect.width, 
                y: (e.clientY - rect.top) / rect.height 
            }));
            hiddenInput.focus(); // تفعيل الكيبورد عند اللمس
        });

        // 3. إرسال النص
        hiddenInput.addEventListener('input', (e) => {
            if (e.target.value.length > 0) {
                ws.send(JSON.stringify({ type: 'text', value: e.target.value }));
                e.target.value = ""; // مسح الحقل بعد الإرسال
            }
        });
    </script>
</body>
</html>
