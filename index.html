<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>بث وتحكم</title>
    <style>
        body { margin: 0; background: #000; height: 100vh; overflow: hidden; }
        /* جعل الصورة تأخذ كامل المساحة بدون أي تقطيع */
        #screenDisplay { width: 100vw; height: 100vh; object-fit: contain; cursor: crosshair; }
        /* حقل مخفي تماماً - لا يظهر في الشاشة */
        #hiddenInput { position: absolute; opacity: 0; top: 0; left: 0; height: 1px; width: 1px; }
    </style>
</head>
<body>
    <input type="text" id="hiddenInput">
    
    <img id="screenDisplay" />
    
    <script>
        const ws = new WebSocket(`${window.location.protocol === 'https:' ? 'wss:' : 'ws:'}//${window.location.host}`);
        const img = document.getElementById('screenDisplay');
        const hiddenInput = document.getElementById('hiddenInput');

        // عند لمس أي مكان في الشاشة، اجعل التركيز على الحقل المخفي فتظهر اللوحة
        document.body.addEventListener('click', () => {
            hiddenInput.focus();
        });

        // عند الكتابة في لوحة المفاتيح، أرسل النص فوراً
        hiddenInput.oninput = (e) => {
            if (e.target.value.length > 0) {
                ws.send(JSON.stringify({ type: 'text', value: e.target.value }));
                hiddenInput.value = ""; // تصفير الحقل للاستعداد للحرف التالي
            }
        };

        // عرض البث
        ws.onmessage = (event) => {
            const blob = new Blob([event.data], { type: 'image/jpeg' });
            if (img.src) URL.revokeObjectURL(img.src);
            img.src = URL.createObjectURL(blob);
        };

        // إرسال اللمس
        img.addEventListener('click', (e) => {
            const rect = img.getBoundingClientRect();
            ws.send(JSON.stringify({ 
                type: 'touch', 
                x: (e.clientX - rect.left) / rect.width, 
                y: (e.clientY - rect.top) / rect.height 
            }));
        });
    </script>
</body>
</html>
