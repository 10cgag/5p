<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تحكم عن بعد - 5P Pro</title>
    <style>
        body {
            background-color: #000;
            color: white;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            margin: 0;
            padding: 0;
            overflow: hidden;
            touch-action: none;
        }
        #header {
            width: 100%;
            background: #111;
            padding: 8px 0;
            text-align: center;
            border-bottom: 1px solid #333;
        }
        #status {
            font-size: 13px;
            color: #ffb400;
        }
        #container {
            flex: 1;
            position: relative;
            width: 100%;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #remoteScreen {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        #controls {
            width: 100%;
            background: #111;
            padding: 10px;
            display: flex;
            gap: 8px;
            box-sizing: border-box;
            border-top: 1px solid #333;
        }
        #textInput {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #444;
            background: #222;
            color: white;
            font-size: 16px;
            outline: none;
        }
        #sendBtn {
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            background: #00ffcc;
            color: #000;
            font-weight: bold;
            cursor: pointer;
        }
        #sendBtn:active { opacity: 0.7; }
    </style>
</head>
<body>

    <div id="header">
        <div id="status">جاري الاتصال...</div>
    </div>

    <div id="container">
        <img id="remoteScreen" draggable="false" alt="في انتظار البث..." />
    </div>

    <div id="controls">
        <input type="text" id="textInput" placeholder="اكتب هنا للتحكم..." autocomplete="off">
        <button id="sendBtn">إرسال</button>
    </div>

    <script>
        const statusDiv = document.getElementById('status');
        const imgElement = document.getElementById('remoteScreen');
        const textInput = document.getElementById('textInput');
        const sendBtn = document.getElementById('sendBtn');

        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const socket = new WebSocket(`${protocol}//${window.location.host}`);
        socket.binaryType = 'blob';

        socket.onopen = () => {
            statusDiv.innerText = '✅ متصل: يمكنك اللمس والكتابة الآن';
            statusDiv.style.color = '#00ffcc';
        };

        let lastObjectUrl = null;
        socket.onmessage = (event) => {
            if (event.data instanceof Blob) {
                if (lastObjectUrl) URL.revokeObjectURL(lastObjectUrl);
                lastObjectUrl = URL.createObjectURL(event.data);
                imgElement.src = lastObjectUrl;
            }
        };

        function sendText() {
            const val = textInput.value;
            if (val && socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify({ type: 'text', value: val }));
                socket.send(JSON.stringify({ type: 'key', value: 'Enter' }));
                textInput.value = '';
            }
            textInput.focus();
        }

        sendBtn.onclick = sendText;
        textInput.onkeydown = (e) => { if (e.key === 'Enter') sendText(); };

        function handleInteraction(e) {
            e.preventDefault();
            const rect = imgElement.getBoundingClientRect();
            
            const clientX = e.clientX || (e.touches && e.touches[0].clientX);
            const clientY = e.clientY || (e.touches && e.touches[0].clientY);
            
            if (clientX === undefined || clientY === undefined) return;

            const x = (clientX - rect.left) / rect.width;
            const y = (clientY - rect.top) / rect.height;

            if (x >= 0 && x <= 1 && y >= 0 && y <= 1) {
                if (socket.readyState === WebSocket.OPEN) {
                    socket.send(JSON.stringify({
                        type: 'touch',
                        x: x,
                        y: y
                    }));
                    
                    // تنبيه مرئي في المتصفح عند الضغط
                    const oldText = statusDiv.innerText;
                    statusDiv.innerText = "👆 تم إرسال ضغطة...";
                    statusDiv.style.color = "#fff";
                    setTimeout(() => { 
                        statusDiv.innerText = oldText; 
                        statusDiv.style.color = "#00ffcc";
                    }, 400);
                }
            }
        }

        imgElement.addEventListener('mousedown', handleInteraction);
        imgElement.addEventListener('touchstart', handleInteraction, { passive: false });

        socket.onclose = () => {
            statusDiv.innerText = '❌ انقطع الاتصال - يرجى التحديث';
            statusDiv.style.color = '#ff4d4d';
        };
    </script>
</body>
</html>
