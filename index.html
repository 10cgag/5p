<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Remote Control</title>
    <style>
        body {
            background-color: #121212;
            color: white;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 5px;
            box-sizing: border-box;
            overflow: hidden;
        }
        #status {
            margin-bottom: 5px;
            font-size: 14px;
            font-weight: bold;
            color: #00ffcc;
        }
        #remoteScreen {
            max-width: 100%;
            max-height: 92vh;
            border: 1px solid #333;
            border-radius: 8px;
            object-fit: contain;
            cursor: pointer;
            touch-action: none;
        }
        /* حقل مخفي تماماً لاستدعاء الكيبورد بدون إظهار أي مربع */
        #hiddenInput {
            position: absolute;
            top: 0;
            left: 0;
            width: 1px;
            height: 1px;
            opacity: 0;
            border: none;
            outline: none;
        }
    </style>
</head>
<body>

    <div id="status">جاري الاتصال بالسيرفر...</div>
    <img id="remoteScreen" alt="في انتظار البث..." />

    <!-- حقل إدخال مخفي لتفعيل الكيبورد مباشر عند الضغط -->
    <input type="text" id="hiddenInput" autocomplete="off" capitalize="off" spellcheck="false" />

    <script>
        const statusDiv = document.getElementById('status');
        const imgElement = document.getElementById('remoteScreen');
        const hiddenInput = document.getElementById('hiddenInput');

        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const socket = new WebSocket(`${protocol}//${window.location.host}`);
        socket.binaryType = 'blob';

        socket.onopen = () => {
            statusDiv.innerText = 'متصل بالسيرفر بنجاح ✅';
            statusDiv.style.color = '#00ffcc';
        };

        let lastObjectUrl = null;
        socket.onmessage = (event) => {
            if (event.data instanceof Blob) {
                if (lastObjectUrl) URL.revokeObjectURL(lastObjectUrl);
                lastObjectUrl = URL.createObjectURL(event.data);
                imgElement.src = lastObjectUrl;
            }
        };

        // عند اللمس على الشاشة: إرسال الضغطة للموبايل + فتح الكيبورد تلقائياً
        imgElement.addEventListener('pointerdown', (e) => {
            const rect = imgElement.getBoundingClientRect();
            const x = (e.clientX - rect.left) / rect.width;
            const y = (e.clientY - rect.top) / rect.height;

            if (socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify({
                    type: 'touch',
                    x: x,
                    y: y
                }));
            }

            // التركيز على الحقل المخفي ليظهر كيبورد الجهاز فوراً
            hiddenInput.focus();
        });

        // إرسال كل حرف تكتبه فوراً إلى الجهاز الآخر
        hiddenInput.addEventListener('input', (e) => {
            const val = e.target.value;
            if (val && socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify({
                    type: 'text',
                    value: val
                }));
                hiddenInput.value = ''; // تفريغ الحقل مباشرةً
            }
        });

        // إرسال الأزرار الخاصة مثل Enter و Backspace
        hiddenInput.addEventListener('keydown', (e) => {
            if (socket.readyState !== WebSocket.OPEN) return;
            
            if (e.key === 'Enter') {
                socket.send(JSON.stringify({ type: 'key', value: 'Enter' }));
            } else if (e.key === 'Backspace' && hiddenInput.value === '') {
                socket.send(JSON.stringify({ type: 'key', value: 'Backspace' }));
            }
        });

        socket.onclose = () => {
            statusDiv.innerText = 'تم قطع الاتصال ❌';
            statusDiv.style.color = '#ff4d4d';
        };
    </script>
</body>
</html>
