<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>بث وتحكم مباشر</title>
    <style>
        body { margin: 0; background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; }
        img { max-width: 100%; max-height: 100%; cursor: crosshair; }
    </style>
</head>
<body>
    <img id="screenDisplay" />
    <script>
        const ws = new WebSocket(`${window.location.protocol === 'https:' ? 'wss:' : 'ws:'}//${window.location.host}`);
        const img = document.getElementById('screenDisplay');
        
        ws.onmessage = (event) => {
            if (typeof event.data === 'string') {
                try {
                    const data = JSON.parse(event.data);
                    if (data.type === 'image') img.src = data.payload;
                } catch {
                    img.src = event.data;
                }
            } else {
                img.src = URL.createObjectURL(new Blob([event.data], { type: 'image/jpeg' }));
            }
        };

        // إرسال اللمسة للسيرفر
        img.addEventListener('click', (e) => {
            const rect = img.getBoundingClientRect();
            const x = (e.clientX - rect.left) / rect.width;
            const y = (e.clientY - rect.top) / rect.height;
            ws.send(JSON.stringify({ type: 'touch', x, y }));
        });
    </script>
</body>
</html>
