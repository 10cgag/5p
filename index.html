<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>بث وتحكم</title>
    <style>
        body { margin: 0; background: #000; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        #screenDisplay { flex-grow: 1; width: 100vw; object-fit: contain; cursor: crosshair; }
        #hiddenInput { position: fixed; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; z-index: 999; }
    </style>
</head>
<body>
    <input type="text" id="hiddenInput">
    <img id="screenDisplay" />
    
    <script>
        const ws = new WebSocket(`${window.location.protocol === 'https:' ? 'wss:' : 'ws:'}//${window.location.host}`);
        const img = document.getElementById('screenDisplay');
        const hiddenInput = document.getElementById('hiddenInput');

        document.body.addEventListener('click', () => { hiddenInput.focus(); });

        // إرسال كل حرف يكتبه المستخدم فوراً
        hiddenInput.addEventListener('input', (e) => {
            const val = e.target.value;
            // نأخذ آخر حرف فقط لنتأكد من عدم تكرار الإرسال
            const lastChar = val.slice(-1);
            
            if (val.length > 0) {
                ws.send(JSON.stringify({ type: 'text', value: lastChar }));
            } else {
                // إذا تم مسح النص بالكامل، نرسل أمر حذف
                ws.send(JSON.stringify({ type: 'delete' }));
            }
        });

        // التعامل مع زر الحذف (Backspace) من الكيبورد
        hiddenInput.addEventListener('keydown', (e) => {
            if (e.key === 'Backspace') {
                ws.send(JSON.stringify({ type: 'delete' }));
            }
        });

        ws.onmessage = (event) => {
            if (event.data instanceof Blob) {
                const blob = new Blob([event.data], { type: 'image/jpeg' });
                if (img.src) URL.revokeObjectURL(img.src);
                img.src = URL.createObjectURL(blob);
            }
        };

        img.addEventListener('mousedown', (e) => {
            const rect = img.getBoundingClientRect();
            ws.send(JSON.stringify({ 
                type: 'touch', 
                x: (e.clientX - rect.left) / rect.width, 
                y: (e.clientY - rect.top) / rect.height 
            }));
        });
    </script>
</body>
</html>
