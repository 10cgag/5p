<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تحكم عن بعد Pro</title>
    <style>
        body { margin: 0; background: #000; height: 100vh; display: flex; flex-direction: column; overflow: hidden; touch-action: none; }
        #screenDisplay { width: 100vw; height: 100vh; object-fit: contain; position: absolute; z-index: 1; }
        
        /* حقل الكتابة الشفاف */
        #hiddenInput { 
            position: absolute; 
            top: 0; left: 0; width: 100%; height: 100%; 
            opacity: 0; z-index: 10; 
            font-size: 16px; border: none; outline: none; background: transparent;
        }
    </style>
</head>
<body>
    <input type="text" id="hiddenInput" autofocus autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" inputmode="text">
    <img id="screenDisplay" />
    
    <script>
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const ws = new WebSocket(`${protocol}//${window.location.host}`);
        const img = document.getElementById('screenDisplay');
        const hiddenInput = document.getElementById('hiddenInput');

        // نستخدم مسافة واحدة كقيمة وهمية لضمان عمل الكيبورد في الموبايل
        const DUMMY = " "; 
        hiddenInput.value = DUMMY;

        ws.onopen = () => {
            hiddenInput.focus();
            hiddenInput.setSelectionRange(1, 1);
        };

        // إرسال اللمس (يدعم الماوس واللمس معاً)
        function sendTouch(clientX, clientY) {
            const rect = img.getBoundingClientRect();
            // حساب الإحداثيات مع مراعاة أبعاد الصورة الفعلية
            ws.send(JSON.stringify({ 
                type: 'touch', 
                x: clientX / rect.width, 
                y: clientY / rect.height 
            }));
        }

        hiddenInput.addEventListener('mousedown', (e) => {
            sendTouch(e.clientX, e.clientY);
        });

        hiddenInput.addEventListener('touchstart', (e) => {
            const touch = e.touches[0];
            sendTouch(touch.clientX, touch.clientY);
        });

        // التقاط الأزرار الخاصة
        hiddenInput.onkeydown = (e) => {
            if (e.key === 'Enter') {
                ws.send(JSON.stringify({ type: 'key', value: 'Enter' }));
            } else if (e.key === ' ') {
                ws.send(JSON.stringify({ type: 'key', value: ' ' }));
                e.preventDefault();
            }
        };

        // معالجة النصوص وحساب عمليات المسح والكتابة
        hiddenInput.oninput = (e) => {
            const val = e.target.value;
            
            if (val.length < DUMMY.length) {
                // تم الضغط على مسح (Backspace)
                ws.send(JSON.stringify({ type: 'key', value: 'Backspace' }));
            } else if (val.length > DUMMY.length) {
                // تم كتابة نص جديد
                const added = val.replace(DUMMY, "");
                if (added.length > 0) {
                    ws.send(JSON.stringify({ type: 'text', value: added }));
                }
            }
            
            // إعادة الحقل لوضعه الأصلي فوراً
            hiddenInput.value = DUMMY;
            hiddenInput.setSelectionRange(1, 1);
        };

        // عرض بث الشاشة
        ws.onmessage = (event) => {
            if (event.data instanceof Blob) {
                const url = URL.createObjectURL(event.data);
                img.src = url;
                img.onload = () => URL.revokeObjectURL(url);
            }
        };

        // إعادة التركيز على الحقل إذا فقده
        document.body.onclick = () => hiddenInput.focus();
    </script>
</body>
</html>
