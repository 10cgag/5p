<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body { margin: 0; padding: 0; background-color: #ffffff; width: 100vw; height: 100vh; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        #screenDisplay { max-width: 100vw; max-height: 100vh; object-fit: contain; cursor: crosshair; }
    </style>
</head>
<body>
    <img id="screenDisplay" />
    <script>
        const ws = new WebSocket(`${window.location.protocol === 'https:' ? 'wss:' : 'ws:'}//${window.location.host}`);
        const img = document.getElementById('screenDisplay');
        
        ws.onmessage = async (e) => {
            if (e.data instanceof Blob || e.data instanceof ArrayBuffer) {
                const blob = new Blob([e.data], { type: 'image/jpeg' });
                const url = URL.createObjectURL(blob);
                img.onload = () => URL.revokeObjectURL(url); // مسح الذاكرة بعد التحميل
                img.src = url;
            }
        };

        img.addEventListener('click', (e) => {
            const rect = img.getBoundingClientRect();
            ws.send(JSON.stringify({ 
                type: 'touch', 
                x: (e.clientX - rect.left) / rect.width, 
                y: (e.clientY - rect.top) / rect.height 
            }));
        });
    </script>
</body>
</html>
