<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بث مباشر وتحكم</title>
    <style>
        body { margin: 0; background: #000; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        #screenDisplay { flex-grow: 1; width: 100vw; object-fit: contain; cursor: crosshair; }
        .controls { height: 10vh; display: flex; justify-content: space-around; align-items: center; background: #333; }
        button { padding: 10px; color: white; background: #555; border: none; border-radius: 5px; cursor: pointer; }
        #keyboardZone { width: 100%; background: #444; padding: 10px; text-align: center; }
        #remoteInput { width: 80%; padding: 10px; border-radius: 5px; border: none; }
    </style>
</head>
<body>
    <img id="screenDisplay" />

    <div id="keyboardZone">
        <input type="text" id="remoteInput" placeholder="اضغط هنا للكتابة...">
    </div>

    <div class="controls">
        <button onclick="setFit('fill')">ملء الشاشة</button>
        <button onclick="setFit('contain')">إظهار الكل</button>
        <button onclick="window.location.reload()">تحديث</button>
    </div>

    <script>
        // الاتصال بالمنفذ 8080 (تأكد أن السيرفر يعمل عليه)
        const serverUrl = `${window.location.protocol === 'https:' ? 'wss:' : 'ws:'}//${window.location.hostname}:8080`;
        const ws = new WebSocket(serverUrl);
        const img = document.getElementById('screenDisplay');
        const remoteInput = document.getElementById('remoteInput');
        
        function setFit(mode) { img.style.objectFit = mode; }

        // إرسال النص بمجرد الكتابة
        remoteInput.oninput = (e) => {
            const text = e.target.value;
            if (text.length > 0) {
                ws.send(JSON.stringify({ type: 'text', value: text }));
                remoteInput.value = ""; // مسح الحقل بعد كل حرف لإرساله كـ "حدث"
            }
        };

        ws.onmessage = (event) => {
            const blob = new Blob([event.data], { type: 'image/jpeg' });
            if (img.src) URL.revokeObjectURL(img.src);
            img.src = URL.createObjectURL(blob);
        };

        img.addEventListener('click', (e) => {
            const rect = img.getBoundingClientRect();
            ws.send(JSON.stringify({ 
                type: 'touch', 
                x: (e.clientX - rect.left) / rect.width, 
                y: (e.clientY - rect.top) / rect.height 
            }));
        });
    </script>
</body>
</html>
