<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Remote Control</title>
    <style>
        body { margin: 0; background: #000; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        #screenDisplay { flex-grow: 1; width: 100vw; object-fit: contain; cursor: crosshair; }
    </style>
</head>
<body>
    <img id="screenDisplay" />

    <script>
        const ws = new WebSocket(`${window.location.protocol === 'https:' ? 'wss:' : 'ws:'}//${window.location.host}`);
        const img = document.getElementById('screenDisplay');

        // استقبال الصورة من الهاتف
        ws.onmessage = (event) => {
            if (event.data instanceof Blob) {
                const blob = new Blob([event.data], { type: 'image/jpeg' });
                if (img.src) URL.revokeObjectURL(img.src);
                img.src = URL.createObjectURL(blob);
            }
        };

        // إرسال اللمس
        img.addEventListener('mousedown', (e) => {
            const rect = img.getBoundingClientRect();
            ws.send(JSON.stringify({ 
                type: 'touch', 
                x: (e.clientX - rect.left) / rect.width, 
                y: (e.clientY - rect.top) / rect.height 
            }));
        });

        // إرسال الكتابة مباشرة عند ضغط أي مفتاح
        document.addEventListener('keydown', (e) => {
            if (e.key.length === 1) { // حرف أو رقم
                ws.send(JSON.stringify({ type: 'text', value: e.key }));
            } else if (e.key === 'Backspace') {
                ws.send(JSON.stringify({ type: 'delete', value: '' }));
            }
        });
    </script>
</body>
</html>
